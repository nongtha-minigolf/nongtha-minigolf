<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c3324">
  <title>Nongtha Minigolf</title>
  <meta name="description" content="">
  <link rel="icon" href="assets/images/logo.jpg" type="image/jpeg">
  <link rel="apple-touch-icon" href="assets/images/logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+Lao:wght@400;600;700&family=Noto+Sans+Thai:wght@400;600;700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-lang="en">
  <!-- Les textes, photos et infos se changent dans contenu.js -->
  <a class="skip" href="#find-us" data-i18n="cta_map">How to get here</a>

  <header class="top">
    <a class="brand" href="#top">
      <img data-src="logo" alt="" width="44" height="44">
      <span>
        <strong data-text="nom"></strong>
        <small lang="lo" data-text="nom-local"></small>
      </span>
    </a>
    <div class="top-actions">
      <div class="langs" role="group" aria-label="Language" data-langs></div>
      <a class="btn btn-flag top-call" data-href="tel" data-text="appel"></a>
    </div>
  </header>

  <main id="top">
    <section class="hero">
      <div class="hero-top">
        <div class="hero-copy">
          <p class="eyebrow" data-i18n="eyebrow"></p>
          <h1 data-i18n="hero"></h1>
        </div>
        <img class="hero-mascot" data-src="mascotte" alt="" width="96" height="96">
      </div>
      <p class="lead" data-i18n="lead"></p>
      <div class="hero-cta">
        <a class="btn btn-flag" href="#find-us" data-i18n="cta_map"></a>
        <a class="btn btn-ghost" data-href="tel" data-text="tel-affiche"></a>
      </div>
    </section>

    <section class="panel" id="find-us">
      <p class="kicker" data-i18n="kicker_access"></p>
      <h2 data-i18n="h_access"></h2>
      <p class="sub" data-i18n="sub_access"></p>
      <div class="access-grid">
        <article class="card">
          <h3 data-i18n="h_address"></h3>
          <p class="address" data-html="adresse"></p>
          <p class="address lao" lang="lo" data-html="adresse-locale"></p>
          <p class="gps" data-text="gps"></p>
          <div class="btn-row">
            <a class="btn btn-flag" data-href="maps" target="_blank" rel="noopener" data-i18n="maps"></a>
            <button class="btn btn-ghost" type="button" id="copy-driver" data-i18n="copy_driver"></button>
          </div>
        </article>
        <ol class="tips">
          <li>
            <strong data-i18n="tip1_t"></strong>
            <span data-i18n="tip1"></span>
          </li>
          <li>
            <strong data-i18n="tip2_t"></strong>
            <span data-i18n="tip2"></span>
          </li>
          <li>
            <strong data-i18n="tip3_t"></strong>
            <span data-i18n="tip3"></span>
          </li>
        </ol>
      </div>
      <a class="map-card" data-href="maps" target="_blank" rel="noopener">
        <strong data-i18n="map_tap"></strong>
        <small data-text="map-hint"></small>
      </a>
      <div class="map-embed">
        <iframe data-map-embed loading="lazy"></iframe>
      </div>
    </section>

    <section class="panel" id="photos">
      <p class="kicker" data-i18n="kicker_gallery"></p>
      <h2 data-i18n="h_gallery"></h2>
      <p class="sub gallery-empty" data-gallery-empty hidden data-i18n="gallery_empty"></p>
      <div class="gallery-strip" data-gallery hidden></div>
    </section>

    <section class="panel phone-panel" id="call">
      <p class="kicker" data-i18n="kicker_call"></p>
      <h2 data-i18n="h_call"></h2>
      <p class="sub" data-i18n="sub_call"></p>
      <a class="phone-number" data-href="tel" data-text="tel-affiche"></a>
      <p class="intl" data-text="tel-intl"></p>
      <div class="btn-row triple">
        <a class="btn btn-flag" data-href="tel" data-i18n="call_now"></a>
        <a class="btn btn-ghost" data-href="whatsapp" target="_blank" rel="noopener">WhatsApp</a>
        <button class="btn btn-ghost" type="button" id="copy-phone" data-i18n="copy_num"></button>
      </div>
    </section>

    <section class="split">
      <article class="panel tight" id="hours">
        <p class="kicker" data-i18n="kicker_hours"></p>
        <h2 data-i18n="h_hours"></h2>
        <p class="open-pill" data-open-status data-i18n="checking"></p>
        <table class="hours" data-hours></table>
        <p class="note" data-i18n="hours_note"></p>
      </article>
      <article class="panel tight" id="about">
        <p class="kicker" data-i18n="kicker_about"></p>
        <h2 data-i18n="h_about"></h2>
        <p data-i18n="about1"></p>
        <p data-i18n="about2"></p>
        <p><a data-href="facebook" target="_blank" rel="noopener" data-text="facebook"></a></p>
      </article>
    </section>
  </main>

  <footer class="foot">
    <img data-src="logo" alt="" width="64" height="64">
    <p>
      <span data-text="nom"></span> · <span data-text="nom-local"></span><br>
      <a data-href="tel" data-text="tel-affiche"></a> ·
      <a data-href="email" data-text="email"></a>
    </p>
  </footer>

  <nav class="dock" aria-label="Quick actions">
    <a class="dock-maps" data-href="maps" target="_blank" rel="noopener" data-i18n="dock_maps"></a>
    <a class="dock-call" data-href="tel" data-i18n="dock_call"></a>
    <a class="dock-wa" data-href="whatsapp" target="_blank" rel="noopener">WhatsApp</a>
  </nav>

  <dialog class="lightbox" data-lightbox aria-label="Photo">
    <button class="lightbox-close" type="button" data-lightbox-close aria-label="Close">×</button>
    <button class="lightbox-nav prev" type="button" data-lightbox-prev aria-label="Previous">‹</button>
    <img alt="">
    <button class="lightbox-nav next" type="button" data-lightbox-next aria-label="Next">›</button>
  </dialog>

  <p class="toast" data-toast hidden></p>
  <script src="contenu.js"></script>
  <script src="script.js"></script>
</body>
</html>
